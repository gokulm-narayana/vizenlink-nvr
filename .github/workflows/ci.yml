name: CI

on:
  push:
  pull_request:

jobs:
  test:
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    env:
      NVR_SECRETS_BACKEND: file
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: Sync dependencies
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Lint and format check (Ubuntu 3.13 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          uv run ruff check --exclude contracts .
          uv run ruff format --check src tests sim tools
      - name: Type check (Ubuntu 3.13 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: uv run mypy src
      - name: Run tests
        run: uv run pytest
      - name: Cache MediaMTX binary
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/vizenlink-nvr
            ~/Library/Caches/vizenlink-nvr
            ~/AppData/Local/vizenlink-nvr
          key: mediamtx-v1.21.3-${{ runner.os }}-${{ runner.arch }}
      - name: Fetch MediaMTX binary
        run: uv run python tools/fetch_mediamtx.py
      - name: Run MediaMTX integration tests
        timeout-minutes: 10
        run: uv run pytest -m mediamtx
      - name: Verify contract mirrors drift
        run: uv run python tools/drift_check.py --self
      - name: Migration drift check
        env:
          NVR_DATA_DIR: ${{ runner.temp }}/nvr-alembic
        run: |
          uv run alembic upgrade head
          uv run alembic check

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/vizenlink_nvr/web
    env:
      NVR_SECRETS_BACKEND: file
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: src/vizenlink_nvr/web/package-lock.json
      - name: Check Node version floor
        run: node -e 'const [maj, min] = process.versions.node.split(".").map(Number); if (maj < 24 || (maj === 24 && min < 15)) { console.error("Node 24.15+ required, found " + process.versions.node); process.exit(1); }'
      - name: Install dependencies
        run: npm ci
      - name: Build web bundle
        run: npm run build
      - name: Run web tests
        run: npm test
      - name: Run design gates
        run: npm run gates
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Sync Python dependencies
        working-directory: .
        run: uv sync --locked
      - name: Verify bundle served by backend
        working-directory: .
        run: uv run pytest tests/integration/test_web_bundle_served.py -q
