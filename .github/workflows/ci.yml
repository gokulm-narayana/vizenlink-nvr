name: CI

on:
  push:
  pull_request:

jobs:
  test:
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    env:
      NVR_SECRETS_BACKEND: file
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: Sync dependencies
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Lint and format check (Ubuntu 3.13 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: Type check (Ubuntu 3.13 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: uv run mypy src
      - name: Run tests
        run: uv run pytest
      - name: Migration drift check
        env:
          NVR_DATA_DIR: ${{ runner.temp }}/nvr-alembic
        run: |
          uv run alembic upgrade head
          uv run alembic check
