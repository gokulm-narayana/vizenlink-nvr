openapi: 3.1.0
info:
  title: NuraEye Camera REST API
  version: "1.0.0"
  description: >
    Resource-oriented REST API exposed by the camera firmware under /nuraeye/. Generated from
    nuraeye/nuraeye.c (nuraeye_processRestRequest() and its static handlers) by
    /generate_camera_api — do not hand-edit; re-run the command to resync after any REST
    handler change.


    Scope (deliberately narrow, matching design/Camera-REST-API.md exactly — 27 paths, one
    per operationId group below): only the /nuraeye/* REST endpoints documented in that doc's
    §2.1. Explicitly NOT covered by this spec, even though they're documented in sibling
    sections of the same file or a related one:
      - The legacy single-endpoint /nuraeye JSON-RPC API (design/Camera-REST-API.md's own
        "legacy" note / design/FR-nuraeye-service.md FR-NE-080) — different wire shape
        entirely, not resource-oriented, not expressible as OpenAPI paths the same way.
      - /webrtc and /webrtc/stop signaling (design/Camera-REST-API.md §2.2,
        module_webrtc.c) — a different subsystem, not part of nuraeye_processRestRequest().
      - OTA firmware upload (design/Camera-REST-API.md §2.3) — a binary stream upload, not a
        JSON REST resource.
      - ONVIF SOAP (design/Camera-ONVIF-API.md) — separate, static, on-hold doc; not synced by
        /generate_camera_api at all (see that command's own scope note).
    If any of those need an OpenAPI/AsyncAPI description later, that's separate, deliberately
    out-of-scope work for this file — do not silently expand it to cover them.
  x-source: nuraeye/nuraeye.c
  x-generated-by: /generate_camera_api
  x-generated-date: "2026-08-13"

servers:
  - url: "{scheme}://{camera_ip}"
    description: >
      Camera main server (onvif_server_config.c:116's http_port = USE_HTTPS ? 443 : 80). No
      port in the URL — 443/80 are the https/http scheme defaults, so stating either explicitly
      would be redundant; only a genuinely non-standard port needs to appear here.
    variables:
      scheme:
        default: https
        enum: [https, http]
        description: https on a USE_HTTPS build (the norm), http otherwise
      camera_ip:
        default: 192.168.1.50

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Token obtained from POST /nuraeye/session/login (FR-NE-105). Required on every
        resource except /nuraeye/identity and /nuraeye/session/login. Idle timeout 1800s
        (NURAEYE_SESSION_IDLE_TIMEOUT_MS); the device holds at most NURAEYE_SESSION_MAX_CLIENTS
        (10) concurrent sessions, evicting the least-recently-used on overflow.

  schemas:
    SuccessEnvelope:
      type: object
      required: [error_code, error_msg]
      properties:
        error_code: { type: integer, enum: [0] }
        error_msg: { type: string, enum: [Success] }

    ErrorResponse:
      type: object
      required: [error_code, error_msg, output]
      description: >
        Every REST response (success or failure) carries this shape or SuccessEnvelope+output —
        unlike the legacy /nuraeye endpoint, which returns an empty body on failure.
      properties:
        error_code: { type: integer, description: "Mirrors the HTTP status code" }
        error_msg: { type: string }
        output: { type: object, description: "Always empty ({}) on error" }

  responses:
    BadRequest:
      description: Missing or malformed input
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Forbidden:
      description: >
        Authenticated, but the account's role is below what this route needs (FR-NE-130, added 2026-10-09). Distinct from 401, which means
        "log in again / wrong credentials": the session is fine and stays valid, this account just may not do this. The body carries
        reason "role_not_permitted". Required role per route: reads and live/playback -> User; changing runtime behaviour (privacy, deterrence,
        image/audio/event settings, two-way talk) -> Operator; device configuration (Wi-Fi, storage, recording mode, cloud parameters, OTA, users)
        -> Administrator. Any route not classified is Administrator-only.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                properties:
                  reason: { type: string, enum: [role_not_permitted] }
    PasswordChangeRequired:
      description: >
        The camera still has the factory-default Administrator password and (in a build that forces the change, always in production) serves nothing
        but the basics until it is changed (FR-CF-158, 2026-10-09). Still served: the no-login ONVIF actions (GetDeviceInformation, GetCapabilities, ...),
        POST /nuraeye/identity, POST /nuraeye/session/login (which reports password_change_required), GET /nuraeye/capabilities, and the Administrator's own
        password change (ONVIF SetUser, WAN SetUserPassword). Everything else, on every transport, answers 428 (RTSP simply never authenticates).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                properties:
                  reason: { type: string, enum: [password_change_required] }
    TooManyAttempts:
      description: >
        Too many consecutive failed sign-ins for this account from this address (FR-CF-157, 2026-10-09): 5 failures block the account for 60 s,
        doubling to 15 minutes (the Administrator: 15 s, at most 30 s). Refused without checking, so even the correct password gets no answer until the block ends.
        Other accounts are unaffected. A success or 15 quiet minutes clears the count.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                properties:
                  reason: { type: string, enum: [too_many_attempts] }
                  retry_after_seconds: { type: integer, example: 60 }
    Unauthorized:
      description: Missing/invalid bearer token, or (login/identity) invalid credentials/digest
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: Resource not found (e.g. unknown alert rule) or unrecognized path
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    MethodNotAllowed:
      description: Path is a known resource, but not for this HTTP method
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    InternalError:
      description: Firmware-side failure applying or persisting the request
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotImplemented:
      description: Feature disabled/absent in this build (e.g. AWS IoT not compiled in)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    MisdirectedRequest:
      description: >
        The request carried an X-VizenLink-Camera-Id header that does not match this camera's serial number (FR-CF-155/FR-NE-129): the request was
        meant for a different camera. Returned before routing and before authentication; the camera's own serial is never in the body. Requests
        without the header are never refused.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    ServiceUnavailable:
      description: >
        A firmware upload is in progress (BUG-059). Every request except the upload itself is refused with HTTP 503 and error_msg
        "Firmware upgrade in progress" until the camera reboots (upload finished, failed or aborted).
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------------------------------
  # Unauthenticated (session bootstrap / device identity)
  # ---------------------------------------------------------------------------------------

  /nuraeye/identity:
    post:
      operationId: identityChallenge
      summary: REST equivalent of the legacy AreYouNuraeyeDevice action
      description: >
        Lets a client confirm this is a genuine NuraEye device during discovery, using a fixed,
        publicly-documented challenge string — not a real credential check (same security
        property as the legacy action; the digest is of a fixed string, not the device password).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nonce, created, digest]
              properties:
                nonce: { type: string, description: Base64-encoded random nonce, client-generated }
                created: { type: string, format: date-time }
                digest: { type: string, description: "Base64(SHA256(nonce+created+\"are-you-onchip-nuraeye\"))" }
      responses:
        "200":
          description: Genuine device
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        properties:
                          reply: { type: string, description: "Base64(SHA256(nonce+created+\"yes-i-am-onchip-nuraeye\"))" }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /nuraeye/session/login:
    post:
      operationId: sessionLogin
      summary: Exchange device credentials for a bearer token (FR-NE-105)
      description: >
        The one-time WSSE-style digest exchange (same credentials as the legacy /nuraeye
        endpoint and ONVIF). auth_credentials is a nested object because this reuses the shared
        OnvifUsernameTokenStruct parser used across ONVIF and other NuraEye auth flows — not a
        REST inconsistency.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_credentials]
              properties:
                auth_credentials:
                  type: object
                  required: [username, password_digest, nonce, created]
                  properties:
                    username: { type: string }
                    password_digest: { type: string, description: "Base64(SHA256(nonce+created+device_password))" }
                    nonce: { type: string }
                    created: { type: string, format: date-time }
                client_label:
                  type: string
                  description: "Optional display label, e.g. \"Mom's iPhone\" — audit/UX only, never a security boundary"
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        properties:
                          token: { type: string }
                          expires_in_sec: { type: integer, example: 1800 }
                          username: { type: string, example: admin, description: "The camera account the session belongs to (FR-NE-130)." }
                          role: { type: string, enum: [Administrator, Operator, User], example: Administrator, description: "That account's role; every later request is authorised against it (FR-NE-130)." }
                          password_change_required: { type: boolean, example: false, description: "True while the camera still has the factory-default Administrator password and enforces the first change (FR-CF-158): every request except GET /nuraeye/capabilities then answers 428 until the Administrator sets a new password (ONVIF SetUser / WAN SetUserPassword)." }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "429": { $ref: '#/components/responses/TooManyAttempts' }

  /nuraeye/session/logout:
    post:
      operationId: sessionLogout
      summary: Revoke the presented bearer token (idempotent)
      description: Revoking an already-unknown/expired token is not an error.
      responses:
        "200": { description: Always succeeds, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }

  # ---------------------------------------------------------------------------------------
  # WiFi
  # ---------------------------------------------------------------------------------------

  /nuraeye/wifi:
    get:
      operationId: getWifi
      responses:
        "200":
          description: Current WiFi credentials (empty strings if never provisioned / Ethernet-connected)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        properties:
                          ssid: { type: string }
                          psk: { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
    post:
      operationId: setWifi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ssid, psk]
              properties:
                ssid: { type: string }
                psk: { type: string }
                verify:
                  type: boolean
                  default: true
                  description: >
                    true = connect & verify before saving; false = save only, no connect
                    attempt. Forced false server-side if the camera is currently reached over
                    Ethernet, regardless of the requested value (NW5 safety override).
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
        "500": { $ref: '#/components/responses/InternalError' }

  /nuraeye/wifi/signal:
    get:
      operationId: getWifiSignal
      responses:
        "200":
          description: Current WiFi RSSI/SNR
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        properties:
                          rssi: { type: string, description: "Integer value as a string (wire quirk inherited from the legacy action)" }
                          snr: { type: string, description: "Integer value as a string (wire quirk inherited from the legacy action)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
        "500": { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------------------
  # Timezones
  # ---------------------------------------------------------------------------------------

  /nuraeye/timezones:
    get:
      operationId: getTimezones
      summary: Curated, camera-served time-zone catalog (FR-NE-097)
      responses:
        "200":
          description: Static list — same on every device, not persisted config
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        properties:
                          timezones:
                            type: array
                            items:
                              type: object
                              properties:
                                code: { type: string, example: "IST-5:30" }
                                name: { type: string, example: "India Standard Time - Kolkata (UTC+05:30)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }

  # ---------------------------------------------------------------------------------------
  # Cloud (AWS IoT / KVS)
  # ---------------------------------------------------------------------------------------

  /nuraeye/cloud/parameters:
    get:
      operationId: getCloudParameters
      responses:
        "200":
          description: AWS IoT broker endpoint + KVS stream name
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        properties:
                          iot_broker_endpoint: { type: string }
                          kvs_stream_name: { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
        "500": { $ref: '#/components/responses/InternalError' }
        "501":
          description: AWS disabled in this build (CONFIG_AWS_ENABLED not compiled)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /nuraeye/cloud/streaming:
    get:
      operationId: getCloudStreamingStatus
      responses:
        "200":
          description: Current KVS cloud-streaming status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        properties:
                          stream_status: { type: string, enum: [active, degraded, not_compiled, idle] }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
    post:
      operationId: stopCloudStreaming
      summary: Stop cloud (KVS) streaming — stop only, no LAN "start" (starting is WAN/MQTT-only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean, enum: [false], description: "Only false is accepted" }
      responses:
        "200": { description: Stopped, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }

  # ---------------------------------------------------------------------------------------
  # Alert rules
  # ---------------------------------------------------------------------------------------

  /nuraeye/alert-rules/query:
    post:
      operationId: queryAlertRule
      summary: Read one detection rule's alert choices (read counterpart to POST /nuraeye/alert-rules)
      description: >
        POST, not GET, because it needs input (the rule name) and this API puts all input in a
        JSON body, never a query parameter (see design/FR-nuraeye-service.md FR-NE-104). Split
        onto its own path rather than sharing /nuraeye/alert-rules with the write side, since
        both directions are POST here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule]
              properties:
                rule: { type: string, example: MyPersonDetectorRule }
      responses:
        "200":
          description: Current alert choices for the rule
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        properties:
                          mobile_notifications: { type: boolean }
                          buzzer_activation: { type: boolean }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
        "404": { $ref: '#/components/responses/NotFound' }

  /nuraeye/alert-rules:
    post:
      operationId: setAlertRule
      summary: Update one detection rule's alert choices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule, mobile_notifications, buzzer_activation]
              properties:
                rule: { type: string }
                mobile_notifications: { type: boolean }
                buzzer_activation: { type: boolean }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/InternalError' }

  /nuraeye/events/preferences:
    get:
      operationId: getEventPreferences
      summary: Per-event-type enable/disable state
      description: >
        Not to be confused with /nuraeye/alert-rules above — that's per-rule action toggles
        (mobile_notifications/buzzer_activation); this is whether an event *type* is generated
        at all, device-wide (FR-CF-143/FR-NE-111, added 2026-08-13). Keys are exactly the
        strings GET /nuraeye/capabilities's supported_event_types reports.
      responses:
        "200":
          description: Current enabled/disabled state per event type
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        additionalProperties: { type: boolean }
                        example: { VideoModeChanged: true, PrivacyModeChanged: true, PersonDetected: true }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
    post:
      operationId: setEventPreferences
      summary: Partial update — only keys present in the body change
      description: >
        Disabling a type suppresses it at the source (EventMgr_Send()) — before it reaches
        either the NuraEye MQTT alert topic or ONVIF PullPoint, so a third-party NVR/VMS client
        stops receiving it too, per direct user decision. A key not in supported_event_types is
        a 400, not silently ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: boolean }
              example: { VideoModeChanged: false }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
        "500": { $ref: '#/components/responses/InternalError' }

  /nuraeye/events/response-actions:
    get:
      operationId: getEventResponseActions
      summary: Selected automatic response actions per detection event type
      description: >
        Not to be confused with /nuraeye/events/preferences above (event on/off) or
        /nuraeye/alert-rules (per-rule action toggles) — this controls what happens in
        addition once an already-enabled detection-type event fires (FR-CF-144/FR-NE-112,
        added 2026-08-13). Keys are exactly the detection-type strings GET
        /nuraeye/capabilities's supported_event_deterrence_options reports; state-change
        events are never valid keys here.
      responses:
        "200":
          description: Current selected response actions per detection event type
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        additionalProperties:
                          type: array
                          items: { type: string }
                        example: { PersonDetected: ["mobile_alert", "warning"] }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
    post:
      operationId: setEventResponseActions
      summary: Partial update — each key's array fully replaces that event type's action set
      description: >
        mobile_alert carries no device-side effect (advisory only, read by the receiving app
        to decide whether to show a push notification) — it never gates whether the camera
        delivers the event, unlike /nuraeye/events/preferences. siren/spotlight/warning are
        real physical actions the camera auto-triggers using a firmware-chosen duration. A
        key that isn't a detection-eligible event type, or an action not eligible for that
        type (per supported_event_deterrence_options), is a 400 — the whole request is
        rejected, not partially applied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
              example: { PersonDetected: ["siren", "mobile_alert"] }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
        "500": { $ref: '#/components/responses/InternalError' }

  /nuraeye/events/loitering-duration:
    get:
      operationId: getLoiteringDuration
      summary: Currently-configured loitering-detection dwell duration (FR-CF-150/FR-NE-121)
      responses:
        "200":
          description: Current loitering duration
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        properties:
                          loitering_duration_seconds: { type: integer }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
    post:
      operationId: setLoiteringDuration
      summary: Sets the loitering-detection dwell duration (FR-CF-150/FR-NE-121)
      description: >
        Valid range is GET /nuraeye/capabilities' loitering_duration_min_seconds/max_seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [loitering_duration_seconds], properties: { loitering_duration_seconds: { type: integer } } }
      responses:
        "200": { description: Applied, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
        "500": { $ref: '#/components/responses/InternalError' }

  /nuraeye/events/bbox-overlay:
    get:
      operationId: getBboxOverlay
      summary: Currently-configured detection bounding-box overlay on/off value (FR-CF-151/FR-NE-123)
      responses:
        "200":
          description: Current bbox-overlay value
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
