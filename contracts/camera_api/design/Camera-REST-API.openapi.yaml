          application/json:
            schema:
              type: object
              minProperties: 1
              description: "Provide mic_gain and/or speaker_volume — either alone is valid, both together is valid. Neither is a 400 (not enforceable by this schema alone; see caveat noted when this spec was scoped)."
              properties:
                mic_gain: { type: integer, minimum: 0, maximum: 100 }
                speaker_volume: { type: integer, minimum: 0, maximum: 100 }
      responses:
        "200": { description: Applied, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
