        "200": { description: Applied, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }

  # ---------------------------------------------------------------------------------------
  # Local storage
  # ---------------------------------------------------------------------------------------

  /nuraeye/local-storage:
    get:
      operationId: getLocalStorage
      summary: Live local-storage status (capability flag lives in GET /nuraeye/capabilities)
      responses:
        "200":
          description: Current SD-card status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        properties:
                          enabled: { type: boolean }
                          card_present: { type: boolean }
                          capacity_bytes: { type: integer, format: int64 }
                          free_bytes: { type: integer, format: int64 }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
    post:
      operationId: setLocalStorage
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } }
      responses:
        "200": { description: Applied, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
        "500":
          description: "Failed to apply (capability absent or no card present)"
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  # ---------------------------------------------------------------------------------------
  # Recordings (FR-NE-117) — GET /nuraeye/recordings/{id}/clip is deliberately NOT modeled
  # here: it's a raw binary MP4 file with HTTP Range byte-request support, not a JSON
  # resource — same exclusion reasoning as /webrtc signaling and OTA upload. See
  # Camera-REST-API.md's own entry for that endpoint's request/response shape.
  # ---------------------------------------------------------------------------------------

  /nuraeye/recordings:
    get:
      operationId: getRecordings
      summary: List recorded clips held on local SD storage
      parameters:
        - name: start
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Inclusive lower bound, UTC epoch seconds. Omit for no lower bound.
        - name: end
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Inclusive upper bound, UTC epoch seconds. Omit for no upper bound.
      responses:
        "200":
          description: Clip list (storage_available/card_present distinguish capability/presence from a genuinely empty range)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        properties:
                          storage_available: { type: boolean }
                          card_present: { type: boolean }
                          truncated:
                            type: boolean
                            description: More clips exist in range than fit in this response — narrow start/end rather than expecting pagination.
                          recordings:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  format: int64
                                  description: UTC epoch seconds, clip start time. Pass to GET /nuraeye/recordings/{id}/clip.
                                start: { type: integer, format: int64 }
                                end: { type: integer, format: int64 }
                                size_bytes: { type: integer, format: int64 }
                                active:
                                  type: boolean
                                  description: True if this is the segment currently being written — size_bytes/end are not final yet.
                                trigger:
                                  type: string
                                  nullable: true
                                  description: >
                                    Present only when a matching event was found in the camera's recent (last ~100 events,
                                    RAM-only, does not survive a reboot) alert history. Absence does not mean nothing
                                    happened, just that it's outside that window.
                                  example: "PersonDetected"
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }

  /nuraeye/recordings/clip-duration:
    get:
      operationId: getRecordingClipDuration
      summary: Currently-configured recorded-clip (segment) duration
      responses:
        "200":
          description: Current clip duration
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        properties:
                          clip_duration_seconds: { type: integer }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
    post:
      operationId: setRecordingClipDuration
      summary: Sets the recorded-clip duration for future segment rotations (FR-CF-148/FR-NE-119)
      description: >
        Applies only to the next segment rotation -- the segment currently being written keeps
        its original length. Valid range is GET /nuraeye/capabilities'
        recording_clip_duration_min_seconds/max_seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [clip_duration_seconds], properties: { clip_duration_seconds: { type: integer } } }
      responses:
        "200": { description: Applied, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }

  /nuraeye/recordings/delete:
    post:
      operationId: deleteRecordings
      summary: Deletes specific clips by id, or every clip (FR-NE-120)
      description: >
        One bulk primitive: pass ids to delete specific clips, or delete_all: true to delete
        every recording on the card. Never deletes the currently-recording segment, even if
        requested -- it is silently skipped, not treated as an error. An id that no longer
        exists is likewise silently skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: integer, format: int64 }
                  description: Clip ids to delete (GET /nuraeye/recordings' id field). Ignored if delete_all is true.
                delete_all:
                  type: boolean
                  description: Delete every recording on the card except the currently-recording segment.
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        properties:
                          deleted:
                            type: array
                            items: { type: integer, format: int64 }
                            description: Present for the ids form only -- which ids were actually deleted.
                          deleted_count: { type: integer }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }

  /nuraeye/recordings/mode:
    get:
      operationId: getRecordingMode
      summary: Currently-configured local SD recording mode (FR-CF-046/FR-NE-088)
      responses:
        "200":
          description: Current recording mode
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        properties:
                          mode: { type: string, enum: [continuous, scheduled, event_triggered] }
                          schedule:
                            type: array
                            items:
                              type: object
                              properties:
                                day_of_week: { type: integer, minimum: 0, maximum: 6, description: "0=Sunday..6=Saturday" }
                                start_minute: { type: integer, minimum: 0, maximum: 1439 }
                                end_minute: { type: integer, minimum: 0, maximum: 1439, description: Exclusive; must be > start_minute, no overnight wrap. }
                            description: Only meaningful for mode=scheduled; empty otherwise.
                          event_trigger_source_configured:
                            type: boolean
                            description: FR-CF-047. Only meaningful for mode=event_triggered.
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
    post:
      operationId: setRecordingMode
      summary: Sets the local SD recording mode (FR-CF-046/FR-NE-088)
      description: >
        Which modes are valid on this SKU is GET /nuraeye/capabilities' supported_recording_modes.
        schedule is required (and parsed) only when mode is "scheduled".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [continuous, scheduled, event_triggered] }
                schedule:
                  type: array
                  items:
                    type: object
                    properties:
                      day_of_week: { type: integer, minimum: 0, maximum: 6 }
                      start_minute: { type: integer, minimum: 0, maximum: 1439 }
                      end_minute: { type: integer, minimum: 0, maximum: 1439 }
      responses:
        "200": { description: Applied, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
        "500": { $ref: '#/components/responses/InternalError' }

  /nuraeye/recordings/dates:
    get:
      operationId: getRecordingDates
      summary: Which UTC calendar dates have recorded clips, and how many (FR-NE-124)
      description: >
        For a mobile date-picker: computed from a cheap filename-timestamp directory scan,
        deliberately not sourced from the duration index alone so a clip whose duration repair
        is still pending still counts. Same storage_available/card_present/503-while-indexing
        convention as GET /nuraeye/recordings.
      parameters:
        - name: start
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: UTC epoch seconds, inclusive range start.
        - name: end
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: UTC epoch seconds, inclusive range end.
        - name: tz_offset_minutes
          in: query
          required: false
          schema: { type: integer }
          description: Client's local UTC offset, for bucketing by local calendar day instead of UTC. Defaults to 0 (UTC).
      responses:
        "200":
          description: Datewise clip-count summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        properties:
                          storage_available: { type: boolean }
                          card_present: { type: boolean }
                          dates:
                            type: array
                            items:
                              type: object
                              properties:
                                date: { type: string, description: "YYYYMMDD, 8-digit string." }
                                clip_count: { type: integer }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
        "503":
          description: Recordings index is still building
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_code: { type: integer, example: 503 }
                  error_msg: { type: string }
                  output:
                    type: object
                    properties:
                      retry_after_seconds: { type: integer }

  # ---------------------------------------------------------------------------------------
  # Capabilities (consolidated — see FR-NE-104)
  # ---------------------------------------------------------------------------------------

  /nuraeye/capabilities:
    get:
      operationId: getCapabilities
      summary: Every "is X supported on this build/unit" boolean, in one response
      description: >
        Consolidated 2026-08-08 — replaces the former standalone GET /nuraeye/deterrence/
        capabilities, and pulls the capability-only fields out of GET /nuraeye/local-storage
        and GET /nuraeye/video/night-vision-type. Call once (e.g. app startup / settings-screen
        load) rather than expecting a capability flag on every individual status response.
      responses:
        "200":
          description: Capability flags
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        properties:
                          wan_command_capable: { type: boolean }
                          wan_live_view_capable: { type: boolean }
                          siren_capable: { type: boolean }
                          spotlight_capable: { type: boolean }
                          warning_capable: { type: boolean }
                          local_storage_capable: { type: boolean }
                          recording_clip_duration_min_seconds: { type: integer }
                          recording_clip_duration_max_seconds: { type: integer }
                          supported_recording_modes:
                            type: array
                            items: { type: string, enum: [continuous, scheduled, event_triggered] }
                            example: ["continuous", "scheduled", "event_triggered"]
                            description: >
                              This SKU's recording-mode capability set (FR-CF-048/FR-NE-089),
                              same wire vocabulary as GET/POST /nuraeye/recordings/mode.
                          multi_user: { type: boolean, example: true, description: "True when the camera holds several accounts with roles (FR-CF-156, 2026-10-09)." }
                          default_password_in_use: { type: boolean, example: true, description: "True while the Administrator still has the factory-default password; the app must force a change when adding such a camera (FR-CF-156). The Administrator is always named admin and no account may be set to the default password." }
                          max_users: { type: integer, example: 5, description: "Total accounts the camera supports: one Administrator plus up to max_users-1 Operator/User accounts." }
                          user_roles:
                            type: array
                            items: { type: string, enum: [Operator, User] }
                            example: ["Operator", "User"]
                            description: "Roles that can be given to a non-administrator account."
                          camera_id_check:
                            type: boolean
                            example: true
                            description: >
                              True when this firmware honours the optional X-VizenLink-Camera-Id request header (and the WAN camera_id
                              field) and answers a mismatching id with HTTP 421 (FR-CF-155/FR-NE-129, added 2026-10-08).
                          max_recording_schedule_windows:
                            type: integer
                            example: 14
                            description: >
                              Max total entries the schedule array in POST /nuraeye/recordings/
                              mode (Scheduled mode) may contain (FR-CF-045/FR-NE-089, added
                              2026-09-25) — a fixed compile-time bound
                              (NURAEYE_MAX_RECORDING_SCHEDULE_WINDOWS); Set rejects a longer
                              schedule.
                          loitering_duration_min_seconds: { type: integer }
                          loitering_duration_max_seconds: { type: integer }
                          bbox_overlay_capable:
                            type: boolean
                            description: >
                              Whether this build has a real detection pipeline to draw a box for
                              (FR-CF-151/FR-NE-123, gated on AI_DETECTIONS). The current on/off
                              value is GET/POST /nuraeye/events/bbox-overlay, not here.
                          night_vision_color_capable: { type: boolean }
                          night_vision_smart_capable: { type: boolean }
                          supported_event_types:
                            type: array
                            items: { type: string }
                            example: ["VideoModeChanged", "PrivacyModeChanged", "PersonDetected"]
                            description: >
                              Event strings this build actually generates (FR-CF-143/
                              FR-NE-111, added 2026-08-13) — same identifiers as this API's own
                              alert JSON "event" field and /nuraeye/events/preferences's keys.
                          supported_event_deterrence_options:
                            type: object
                            additionalProperties:
                              type: array
                              items: { type: string }
                            example: { PersonDetected: ["siren", "spotlight", "mobile_alert"] }
                            description: >
                              Per detection-type event, the response actions eligible for it
                              (FR-CF-144/FR-NE-112, added 2026-08-13) — a strict subset of
                              supported_event_types's keys; state-change events never appear
                              here. Intersection of this SKU's siren_capable/spotlight_capable/
                              warning_capable with a firmware-maintained event-type eligibility
                              table. mobile_alert is always eligible, no hardware gate.
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------------------------------
  # Privacy mode
  # ---------------------------------------------------------------------------------------

  /nuraeye/privacy-mode:
    get:
      operationId: getPrivacyMode
      responses:
        "200":
          description: Current privacy mode
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { output: { type: object, properties: { mode: { type: string, enum: [None, Zone, Full] } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
    post:
      operationId: setPrivacyMode
      description: "Setting None or Full clears all configured privacy masks as a side effect."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties: { mode: { type: string, enum: [None, Zone, Full] } }
      responses:
        "200": { description: Applied, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
        "500": { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------------------
  # Buzzer (manual)
  # ---------------------------------------------------------------------------------------

  /nuraeye/buzzer:
    get:
      operationId: getBuzzerStatus
      responses:
        "200":
          description: Whether the buzzer is currently active
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { output: { type: object, properties: { active: { type: boolean } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
    post:
      operationId: setBuzzer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
                duration_seconds: { type: integer, description: "Required when active is true" }
      responses:
        "200": { description: Applied, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }

  # ---------------------------------------------------------------------------------------
  # Video / imaging
  # ---------------------------------------------------------------------------------------

  /nuraeye/video/mode:
    get:
      operationId: getVideoMode
      summary: Day/night mode — configured setting vs. effective live state
      responses:
        "200":
          description: Current day/night configuration and effective state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        properties:
                          configured_mode: { type: string, description: "e.g. Auto, Day, Night — see prvVideoModeToString()" }
                          effective_state: { type: string, enum: [day, night] }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }

  /nuraeye/video/night-vision-type:
    get:
      operationId: getNightVisionType
      summary: Live status only — capability flags moved to GET /nuraeye/capabilities
      responses:
        "200":
          description: Current night-vision type
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        required: [type]
                        properties:
                          type: { type: string, enum: [Grey, Color, Smart] }
                          sub_state: { type: string, enum: [Grey, Color], description: "Present only when type is Smart" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
    post:
      operationId: setNightVisionType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties: { type: { type: string, enum: [Grey, Color, Smart] } }
      responses:
        "200": { description: Applied, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
        "500": { $ref: '#/components/responses/InternalError' }

  /nuraeye/video/mirror-flip:
    get:
      operationId: getMirrorFlip
      responses:
        "200":
          description: Current mirror/flip orientation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { output: { type: object, properties: { mode: { type: string, enum: [Off, Mirror, Flip, Both] } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
    post:
      operationId: setMirrorFlip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties: { mode: { type: string, enum: [Off, Mirror, Flip, Both] } }
      responses:
        "200": { description: Applied, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
        "500": { $ref: '#/components/responses/InternalError' }

  /nuraeye/video/anti-flicker:
    get:
      operationId: getAntiFlickerMode
      summary: Power-line frequency / anti-flicker mode
      description: >
        No ONVIF-standard element exists for this setting (checked against the live
        ImagingSettings20 schema — see kb/raw/2026-08-12-feature-antiflicker-mode.md), so this
        is REST-only from day one, same situation as /nuraeye/video/mirror-flip.
      responses:
        "200":
          description: Current anti-flicker mode
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { output: { type: object, properties: { mode: { type: string, enum: [50Hz, 60Hz, Auto, None] } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
    post:
      operationId: setAntiFlickerMode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties: { mode: { type: string, enum: [50Hz, 60Hz, Auto, None] } }
      responses:
        "200": { description: Applied, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
        "500": { $ref: '#/components/responses/InternalError' }

  /nuraeye/video/image-defaults:
    get:
      operationId: getImageDefaults
      summary: Factory-default ISP imaging settings (read-only reference values)
      responses:
        "200":
          description: Factory defaults for VideoSource_1
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        properties:
                          brightness: { type: number }
                          contrast: { type: number }
                          saturation: { type: number }
                          sharpness: { type: number }
                          white_balance_mode: { type: string }
                          wb_red_gain: { type: number }
                          wb_blue_gain: { type: number }
                          exposure_mode: { type: string }
                          exposure_time: { type: number }
                          exposure_gain: { type: number }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
        "500": { $ref: '#/components/responses/InternalError' }

  /nuraeye/preview-key:
    get:
      operationId: getPreviewKey
      summary: Fetch the camera-generated shared key for end-to-end-encrypted WAN preview snapshots
      description: >
        LAN-only, called by any mobile app at onboarding/first WAN setup
        (FR-CF-141/FR-SECL-017/FR-NE-108). Redesigned 2026-08-21 from a POST-based Set (the app
        pushed its own RSA public key; one stored slot, last write wins, silently locking out
        every previously-registered app) to this GET: the camera generates one shared AES-256
        key on first call and persists it, so any number of apps can fetch the same key and all
        keep working. The matching capture/encrypt/publish path is WAN-MQTT-only
        (GetPreviewSnapshot) and out of this REST API's scope.
      responses:
        "200":
          description: The shared key (generated on first call if none existed yet)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        properties:
                          key:
                            type: string
                            description: base64-encoded AES-256 key (32 bytes)
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
        "500": { $ref: '#/components/responses/InternalError' }

  /nuraeye/live-stream-uri:
    post:
      operationId: getLiveStreamUri
      summary: Resolve the live-view connection URI for a stream profile (transport chosen by the camera)
      description: >
        2026-09-07: replaces the former separate POST /nuraeye/webrtc-uri and
        GET /nuraeye/rtsp-uri — direct user decision, merging them since a client doesn't
        actually care which transport it gets, only that it gets one it can play. The camera
        picks the transport server-side (webrtc when WEBRTC_STREAMING is built in, rtsp
        otherwise, via bsp_camera_isWebRtcCapable()) and reports which one via output.transport.
        POST, not GET, because it needs input (profile_token) and this API puts all input in a
        JSON body. Read-only — no write counterpart, so no path collision like alert-rules had.
        profile_token Profile_3 is a NuraEye-only token (no ONVIF profile at all, FR-CF-153),
        kept for continuity with the pre-2026-09-03 literal name. The WebRTC module
        (module_webrtc.c) is untouched by this — WEBRTC_STREAMING is only commented out, so the
        webrtc transport comes back automatically once it's re-enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_token]
              properties:
                profile_token: { type: string, enum: [Profile_1, Profile_2, Profile_3] }
      responses:
        "200":
          description: Live-view connection info; transport indicates which player to use
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        properties:
                          transport: { type: string, enum: [webrtc, rtsp] }
                          port: { type: integer, example: 556 }
                          path: { type: string, example: /mobile }
                          url: { type: string, format: uri, example: rtsps://192.168.1.50:556/mobile }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }

  /nuraeye/talk-uri:
    post:
      operationId: getTalkUri
      summary: Resolve the two-way-talk connection URI (dedicated audio-only RTSPS module)
      description: >
        Two-way-talk discovery — the talk counterpart of POST /nuraeye/live-stream-uri.
        Resolves the connection info for module_rtsps_talk.c, the dedicated audio-only talk
        RTSPS server (port 560, RECORD-based, two AAC-LC/8000 Hz tracks: streamid=0 camera mic
        to client, streamid=1 client mic to camera), completely independent of live view and
        limited to one talker at a time (FR-CF-131). There is one talk resource (audio-only,
        always-on), so unlike live-stream-uri there is no profile_token and no transport choice:
        the module is TLS-only, so output.transport is always "rtsps". The request body is
        ignored (send an empty object). Local-IP resolution failure, or a build without
        AUDIO_ENABLED, returns 400. A second concurrent talk session is rejected by the module
        at RECORD time, not by this endpoint. No WAN counterpart (FR-NE-081 is Planned); a
        future WAN leg would be an additive transport value here.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Two-way-talk connection info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        properties:
                          transport: { type: string, enum: [rtsps] }
                          port: { type: integer, example: 560 }
                          path: { type: string, example: /talk }
                          url: { type: string, format: uri, example: rtsps://192.168.1.50:560/talk }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }

  # ---------------------------------------------------------------------------------------
  # Deterrence (siren / spotlight / warning)
  # ---------------------------------------------------------------------------------------

  /nuraeye/deterrence:
    get:
      operationId: getDeterrenceStatus
      summary: Each deterrence action's own independent active/inactive state
      description: >-
        siren/spotlight/warning are independent hardware outputs and can be active
        simultaneously (FEAT-236, 2026-08-14 fix — the previous single {active, action} shape
        could only ever report one action as "the" active one, so a client that triggered a
        second action while the first was still on had no way to represent both as active).
      responses:
        "200":
          description: Current deterrence state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        properties:
                          siren: { type: boolean }
                          spotlight: { type: boolean }
                          warning: { type: boolean }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
    post:
      operationId: setDeterrence
      description: >-
        No duration_seconds field (removed FEAT-236, 2026-08-14) — the camera applies its own
        persisted, per-action duration instead, see /nuraeye/deterrence/durations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, active]
              properties:
                action: { type: string, enum: [siren, spotlight, warning] }
                active: { type: boolean }
      responses:
        "200": { description: Applied, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        "400":
          description: "Missing input, unsupported action, or action not supported on this build"
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
  /nuraeye/deterrence/durations:
    get:
      operationId: getDeterrenceDurations
      summary: Persisted, per-action auto-stop configuration for each deterrence action
      description: >-
        Added FEAT-236, 2026-08-14. Shared by both manual (ActivateDeterrence) and automatic
        (response-actions) triggering — one configured value per action, not per-request.
        siren_seconds/spotlight_seconds are whole seconds; warning_repeat_count (renamed from
        warning_seconds, 2026-08-15) is a repeat count, not seconds. See
        /nuraeye/deterrence/durations/options for each key's real valid range.
      responses:
        "200":
          description: Current configured durations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        properties:
                          siren_seconds: { type: integer }
                          spotlight_seconds: { type: integer }
                          warning_repeat_count: { type: integer }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
    post:
      operationId: setDeterrenceDurations
      description: >-
        Partial update — any subset of the three keys. 0-255 below is only the wire type's
        outer bound; the real accepted range per key comes from
        /nuraeye/deterrence/durations/options and is enforced server-side (2026-08-15).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                siren_seconds: { type: integer, minimum: 0, maximum: 255 }
                spotlight_seconds: { type: integer, minimum: 0, maximum: 255 }
                warning_repeat_count: { type: integer, minimum: 0, maximum: 255 }
      responses:
        "200": { description: Applied, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        "400":
          description: "Unrecognized key, value outside the camera-reported range, or action not supported on this build"
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
  /nuraeye/deterrence/durations/options:
    get:
      operationId: getDeterrenceDurationOptions
      summary: Camera-reported valid min/max range for each deterrence duration/count key
      description: >-
        Added 2026-08-15, after real-hardware testing found the mobile app had hardcoded its own
        UI range instead of reading one from the camera.
      responses:
        "200":
          description: Current valid ranges
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        properties:
                          siren_seconds_min: { type: integer }
                          siren_seconds_max: { type: integer }
                          spotlight_seconds_min: { type: integer }
                          spotlight_seconds_max: { type: integer }
                          warning_repeat_count_min: { type: integer }
                          warning_repeat_count_max: { type: integer }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }

  /nuraeye/health:
    get:
      operationId: getDeviceHealth
      summary: Reboot/uptime/clock-sync vitals and firmware version
      description: >-
        Added FR-HLT-009 2026-08-25 (Stage 3's first slice), extended 2026-08-26 with
        uptime_seconds/clock_sync_state/uncertain_since/firmware_version. Read-only, no matching
        POST -- every field is camera-derived, not user-configurable. last_reboot_utc reads 0
        until the first NTP sync of the current boot corrects it (no battery-backed RTC on this
        platform, FR-CF-114 -- every boot's clock starts uncertain by definition); 0 therefore
        means "not yet corrected this boot," not "camera has never booted." clock_sync_state is
        only ever "synced" or "uncertain" -- the BSP layer doesn't distinguish a third
        free-running-since-boot sub-state. firmware_version duplicates GetDeviceInfo's value so
        one call covers full vitals. AI-model version, last-recording-segment timestamp, and a
        reboot-loop flag remain unimplemented.
      responses:
        "200":
          description: Current reboot/uptime/clock-sync health state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      output:
                        type: object
                        properties:
                          reboot_count: { type: integer }
                          last_reboot_utc:
                            type: integer
                            description: UTC epoch seconds; 0 = not yet corrected this boot
                          reboot_reason:
                            type: string
                            description: >
                              Why the current boot happened (BUG-048, added 2026-09-25) --
                              e.g. "Firmware Upgrade", "Factory Reset", "HTTP Server Failure",
                              "Manual Reboot", "WiFi Provisioning", "Sensor Capture Mode
                              Change", or "Unknown / Crash" for a genuine uncontrolled crash.
                              Free text, not a closed enum -- new reasons may be added without
                              a schema change.
                          uptime_seconds: { type: integer }
                          clock_sync_state:
                            type: string
                            enum: [synced, uncertain]
                          uncertain_since:
                            type: integer
                            description: UTC epoch seconds clock became uncertain; 0 if synced
                          firmware_version: { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
