        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
    post:
      operationId: setBboxOverlay
      summary: Sets the detection bounding-box overlay on/off (FR-CF-151/FR-NE-123)
      description: >
        Whether this build is even capable of drawing a box is GET /nuraeye/capabilities'
        bbox_overlay_capable — this pair only reads/writes the current value.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } }
      responses:
        "200": { description: Applied, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "428": { $ref: '#/components/responses/PasswordChangeRequired' }
        "500": { $ref: '#/components/responses/InternalError' }

