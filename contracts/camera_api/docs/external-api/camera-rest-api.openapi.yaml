          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
  /nuraeye/deterrence/durations:
    get:
      operationId: getDeterrenceDurations
      summary: Persisted, per-action auto-stop configuration for each deterrence action
      description: Added, 2026-08-14. Shared by both manual (ActivateDeterrence) and automatic (response-actions) triggering — one configured
        value per action, not per-request. siren_seconds/spotlight_seconds are whole seconds; warning_repeat_count (renamed from warning_seconds,
        2026-08-15) is a repeat count, not seconds. See /nuraeye/deterrence/durations/options for each key's real valid range.
      responses:
        '200':
          description: Current configured durations
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    output:
                      type: object
                      properties:
                        siren_seconds:
                          type: integer
                        spotlight_seconds:
                          type: integer
                        warning_repeat_count:
                          type: integer
