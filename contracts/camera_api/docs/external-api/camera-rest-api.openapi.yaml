  /nuraeye/recordings:
    get:
      operationId: getRecordings
      summary: List recorded clips held on local SD storage
      parameters:
      - name: start
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: Inclusive lower bound, UTC epoch seconds. Omit for no lower bound.
      - name: end
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: Inclusive upper bound, UTC epoch seconds. Omit for no upper bound.
      responses:
        '200':
          description: Clip list (storage_available/card_present distinguish capability/presence from a genuinely empty range)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    output:
                      type: object
                      properties:
                        storage_available:
                          type: boolean
                        card_present:
                          type: boolean
                        truncated:
                          type: boolean
                          description: More clips exist in range than fit in this response — narrow start/end rather than expecting pagination.
                        recordings:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                format: int64
                                description: UTC epoch seconds, clip start time. Pass to GET /nuraeye/recordings/{id}/clip.
                              start:
                                type: integer
                                format: int64
                              end:
                                type: integer
                                format: int64
                              size_bytes:
                                type: integer
                                format: int64
                              active:
                                type: boolean
                                description: True if this is the segment currently being written — size_bytes/end are not final yet.
                              trigger:
                                type: string
                                nullable: true
                                description: |
                                  Present only when a matching event was found in the camera's recent (last ~100 events, RAM-only, does not survive a reboot) alert history. Absence does not mean nothing happened, just that it's outside that window.
                                example: PersonDetected
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
  /nuraeye/recordings/clip-duration:
