          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
  /nuraeye/recordings/delete:
    post:
      operationId: deleteRecordings
      summary: Deletes specific clips by id, or every clip
      description: |
        One bulk primitive: pass ids to delete specific clips, or delete_all: true to delete every recording on the card. Never deletes the currently-recording segment, even if requested -- it is silently skipped, not treated as an error. An id that no longer exists is likewise silently skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: Clip ids to delete (GET /nuraeye/recordings' id field). Ignored if delete_all is true.
                delete_all:
                  type: boolean
                  description: Delete every recording on the card except the currently-recording segment.
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    output:
                      type: object
                      properties:
                        deleted:
                          type: array
                          items:
                            type: integer
                            format: int64
                          description: Present for the ids form only -- which ids were actually deleted.
                        deleted_count:
                          type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
  /nuraeye/recordings/mode:
    get:
      operationId: getRecordingMode
      summary: Currently-configured local SD recording mode
      responses:
        '200':
          description: Current recording mode
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    output:
                      type: object
                      properties:
                        mode:
                          type: string
                          enum:
                          - continuous
                          - scheduled
                          - event_triggered
                        schedule:
                          type: array
                          items:
                            type: object
                            properties:
                              day_of_week:
                                type: integer
                                minimum: 0
                                maximum: 6
                                description: 0=Sunday..6=Saturday
                              start_minute:
                                type: integer
                                minimum: 0
                                maximum: 1439
                              end_minute:
                                type: integer
                                minimum: 0
                                maximum: 1439
                                description: Exclusive; must be > start_minute
                                no overnight wrap.: null
                          description: Only meaningful for mode=scheduled; empty otherwise.
                        event_trigger_source_configured:
                          type: boolean
                          description: . Only meaningful for mode=event_triggered.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
    post:
      operationId: setRecordingMode
      summary: Sets the local SD recording mode
      description: Which modes are valid on this camera is `supported_recording_modes` in GET /nuraeye/capabilities. `schedule` is required (and
        parsed) only when mode is `scheduled`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - mode
              properties:
                mode:
                  type: string
                  enum:
                  - continuous
                  - scheduled
                  - event_triggered
                schedule:
                  type: array
                  items:
                    type: object
                    properties:
                      day_of_week:
                        type: integer
                        minimum: 0
                        maximum: 6
                      start_minute:
                        type: integer
                        minimum: 0
                        maximum: 1439
                      end_minute:
                        type: integer
                        minimum: 0
                        maximum: 1439
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /nuraeye/recordings/dates:
    get:
      operationId: getRecordingDates
      summary: Which UTC calendar dates have recorded clips, and how many
      description: 'For a mobile date-picker: computed from a cheap filename-timestamp directory scan, deliberately not sourced from the duration
        index alone so a clip whose duration repair is still pending still counts. Same storage_available/card_present/503-while-indexing convention
        as GET /nuraeye/recordings.'
      parameters:
      - name: start
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: UTC epoch seconds, inclusive range start.
      - name: end
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: UTC epoch seconds, inclusive range end.
      - name: tz_offset_minutes
        in: query
        required: false
        schema:
          type: integer
        description: Client's local UTC offset, for bucketing by local calendar day instead of UTC. Defaults to 0 (UTC).
      responses:
        '200':
          description: Datewise clip-count summary
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    output:
                      type: object
                      properties:
                        storage_available:
                          type: boolean
                        card_present:
                          type: boolean
                        dates:
                          type: array
                          items:
                            type: object
                            properties:
                              date:
                                type: string
                                description: YYYYMMDD, 8-digit string.
                              clip_count:
                                type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
        '503':
          description: Recordings index is still building
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_code:
                    type: integer
                    example: 503
                  error_msg:
                    type: string
                  output:
                    type: object
                    properties:
                      retry_after_seconds:
                        type: integer
  /nuraeye/capabilities:
    get:
      operationId: getCapabilities
      summary: Every "is X supported on this build/unit" boolean, in one response
      description: Consolidated 2026-08-08 — replaces the former standalone GET /nuraeye/deterrence/ capabilities, and pulls the capability-only
        fields out of GET /nuraeye/local-storage and GET /nuraeye/video/night-vision-type. Call once (e.g. app startup / settings-screen load)
        rather than expecting a capability flag on every individual status response.
      responses:
        '200':
          description: Capability flags
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    output:
                      type: object
                      properties:
                        wan_command_capable:
                          type: boolean
                        wan_live_view_capable:
                          type: boolean
                        siren_capable:
                          type: boolean
                        spotlight_capable:
                          type: boolean
                        warning_capable:
                          type: boolean
                        local_storage_capable:
                          type: boolean
                        recording_clip_duration_min_seconds:
                          type: integer
                        recording_clip_duration_max_seconds:
                          type: integer
                        supported_recording_modes:
                          type: array
                          items:
                            type: string
                            enum:
                            - continuous
                            - scheduled
                            - event_triggered
                          example:
                          - continuous
                          - scheduled
                          - event_triggered
                          description: This camera's recording-mode capability set, in the same wire vocabulary as GET/POST /nuraeye/recordings/mode.
                        multi_user:
                          type: boolean
                          example: true
                          description: True when the camera holds several accounts with roles.
                        default_password_in_use:
                          type: boolean
                          example: true
                          description: True while the Administrator still has the factory-default password; the app must force a change when adding
                            such a camera. The Administrator is always named admin and no account may be set to the default password.
                        max_users:
                          type: integer
                          example: 5
                          description: 'Total accounts the camera supports: one Administrator plus up to max_users-1 Operator/User accounts.'
                        user_roles:
                          type: array
                          items:
                            type: string
                            enum:
                            - Operator
                            - User
                          example:
                          - Operator
                          - User
                          description: Roles that can be given to a non-administrator account.
                        camera_id_check:
                          type: boolean
                          example: true
                          description: True when this firmware honours the optional X-VizenLink-Camera-Id request header (and the WAN camera_id
                            field) and answers a mismatching id with HTTP 421.
                        max_recording_schedule_windows:
                          type: integer
                          example: 14
                          description: Maximum total number of entries the `schedule` array in POST /nuraeye/recordings/mode (Scheduled mode)
                            may contain; Set rejects a longer schedule.
                        loitering_duration_min_seconds:
                          type: integer
                        loitering_duration_max_seconds:
                          type: integer
                        bbox_overlay_capable:
                          type: boolean
                          description: Whether this build has a real detection pipeline to draw a box for (gated on AI_DETECTIONS). The current
                            on/off value is GET/POST /nuraeye/events/bbox-overlay, not here.
                        night_vision_color_capable:
                          type: boolean
                        night_vision_smart_capable:
                          type: boolean
                        supported_event_types:
                          type: array
                          items:
                            type: string
                          example:
                          - VideoModeChanged
                          - PrivacyModeChanged
                          - PersonDetected
                          description: Event strings this build actually generates — same identifiers as this API's own alert JSON "event" field
                            and /nuraeye/events/preferences's keys.
                        supported_event_deterrence_options:
                          type: object
                          additionalProperties:
                            type: array
                            items:
                              type: string
                          example:
                            PersonDetected:
                            - siren
                            - spotlight
                            - mobile_alert
                          description: Per detection-type event, the response actions eligible for it (a subset of the keys of `supported_event_types`;
                            state-change events never appear here). It is the intersection of this camera's `siren_capable`/`spotlight_capable`/`warning_capable`
                            flags with an eligibility table in the firmware. `mobile_alert` is always eligible.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
