          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
    post:
      operationId: setDeterrenceDurations
      description: Partial update — any subset of the three keys. 0-255 below is only the wire type's outer bound; the real accepted range per
        key comes from /nuraeye/deterrence/durations/options and is enforced server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                siren_seconds:
                  type: integer
                  minimum: 0
                  maximum: 255
                spotlight_seconds:
                  type: integer
                  minimum: 0
                  maximum: 255
                warning_repeat_count:
                  type: integer
                  minimum: 0
                  maximum: 255
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Unrecognized key, value outside the camera-reported range, or action not supported on this build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
