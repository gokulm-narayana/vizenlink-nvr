openapi: 3.1.0
info:
  title: VizenLink Camera REST API
  version: 1.0.0
  description: |-
    Resource-oriented REST API served by the camera under /nuraeye/. Every response, success or failure, carries a JSON body. Authenticate once with POST /nuraeye/session/login and send the returned bearer token on every other request.
    Scope: the /nuraeye/* REST endpoints only. ONVIF SOAP is described by the official ONVIF WSDLs and camera-onvif-api.md; the remote (internet) control channel is described in camera-wan-mqtt-api.md.
servers:
- url: '{scheme}://{camera_ip}'
  description: |
    Camera main server: HTTPS on port 443 on production firmware (plain HTTP on 80 only on special builds). No port in the URL, because 443/80 are the scheme defaults.
  variables:
    scheme:
      default: https
      enum:
      - https
      - http
      description: https on a USE_HTTPS build (the norm), http otherwise
    camera_ip:
      default: 192.0.2.50
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token obtained from POST /nuraeye/session/login. Required on every resource except /nuraeye/identity and /nuraeye/session/login.
        Idle timeout 1800s (NURAEYE_SESSION_IDLE_TIMEOUT_MS); the device holds at most NURAEYE_SESSION_MAX_CLIENTS (10) concurrent sessions, evicting
        the least-recently-used on overflow.
  schemas:
    SuccessEnvelope:
      type: object
      required:
      - error_code
      - error_msg
      properties:
        error_code:
          type: integer
          enum:
          - 0
        error_msg:
          type: string
          enum:
          - Success
    ErrorResponse:
      type: object
      required:
      - error_code
      - error_msg
      - output
      description: Every REST response, success or failure, carries this shape or the success envelope with `output`.
      properties:
        error_code:
          type: integer
          description: Mirrors the HTTP status code
        error_msg:
          type: string
        output:
          type: object
          description: Always empty ({}) on error
  responses:
    BadRequest:
      description: Missing or malformed input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 'Authenticated, but the account''s role is below what this route needs. Distinct from 401, which means "log in again / wrong
        credentials": the session is fine and stays valid, this account just may not do this. The body carries reason "role_not_permitted". Required
        role per route: reads and live/playback -> User; changing runtime behaviour (privacy, deterrence, image/audio/event settings, two-way
        talk) -> Operator; device configuration (Wi-Fi, storage, recording mode, cloud parameters, OTA, users) -> Administrator. Any route not
        classified is Administrator-only.'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - type: object
              properties:
                reason:
                  type: string
                  enum:
                  - role_not_permitted
    PasswordChangeRequired:
      description: 'The camera still has the factory-default Administrator password and (in a build that forces the change, always in production)
        serves nothing but the basics until it is changed. Still served: the no-login ONVIF actions (GetDeviceInformation, GetCapabilities,...),
        POST /nuraeye/identity, POST /nuraeye/session/login (which reports password_change_required), GET /nuraeye/capabilities, and the Administrator''s
        own password change (ONVIF SetUser, WAN SetUserPassword). Everything else, on every transport, answers 428 (RTSP simply never authenticates).'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - type: object
              properties:
                reason:
                  type: string
                  enum:
                  - password_change_required
    TooManyAttempts:
      description: 'Too many consecutive failed sign-ins for this account from this address: 5 failures block the account for 60 s, doubling to
        15 minutes (the Administrator: 15 s, at most 30 s). Refused without checking, so even the correct password gets no answer until the block
        ends. Other accounts are unaffected. A success or 15 quiet minutes clears the count.'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - type: object
              properties:
                reason:
                  type: string
                  enum:
                  - too_many_attempts
                retry_after_seconds:
                  type: integer
                  example: 60
    Unauthorized:
      description: Missing/invalid bearer token, or (login/identity) invalid credentials/digest
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found (e.g. unknown alert rule) or unrecognized path
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: Path is a known resource, but not for this HTTP method
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Firmware-side failure applying or persisting the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotImplemented:
      description: The feature is not available on this camera model or firmware.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MisdirectedRequest:
      description: 'The request carried an X-VizenLink-Camera-Id header that does not match this camera''s serial number: the request was meant
        for a different camera. Returned before routing and before authentication; the camera''s own serial is never in the body. Requests without
        the header are never refused.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: A firmware upload is in progress. Every request except the upload itself is refused with HTTP 503 and error_msg "Firmware upgrade
        in progress" until the camera reboots (upload finished, failed or aborted).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
security:
- bearerAuth: []
paths:
  /nuraeye/identity:
    post:
      operationId: identityChallenge
      summary: Confirm the device is a genuine VizenLink camera
      description: 'Lets a client confirm during discovery that this is a genuine VizenLink camera, using a fixed, publicly documented challenge
        string. It is not a credential check: the digest is of a fixed string, not the device password.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nonce
              - created
              - digest
              properties:
                nonce:
                  type: string
                  description: Base64-encoded random nonce
                  client-generated: null
                created:
                  type: string
                  format: date-time
                digest:
                  type: string
                  description: Base64(SHA256(nonce+created+"are-you-onchip-nuraeye"))
      responses:
        '200':
          description: Genuine device
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    output:
                      type: object
                      properties:
                        reply:
                          type: string
                          description: Base64(SHA256(nonce+created+"yes-i-am-onchip-nuraeye"))
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /nuraeye/session/login:
    post:
      operationId: sessionLogin
      summary: Exchange device credentials for a bearer token
      description: The one-time WSSE-style digest exchange (the same credentials as ONVIF). `auth_credentials` is a nested object because it uses
        the same UsernameToken structure as ONVIF.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - auth_credentials
              properties:
                auth_credentials:
                  type: object
                  required:
                  - username
                  - password_digest
                  - nonce
                  - created
                  properties:
                    username:
                      type: string
                    password_digest:
                      type: string
                      description: Base64(SHA256(nonce+created+device_password))
                    nonce:
                      type: string
                    created:
                      type: string
                      format: date-time
                client_label:
                  type: string
                  description: Optional display label, e.g. "Mom's iPhone" — audit/UX only, never a security boundary
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    output:
                      type: object
                      properties:
                        token:
                          type: string
                        expires_in_sec:
                          type: integer
                          example: 1800
                        username:
                          type: string
                          example: admin
                          description: The camera account the session belongs to.
                        role:
                          type: string
                          enum:
                          - Administrator
                          - Operator
                          - User
                          example: Administrator
                          description: That account's role; every later request is authorised against it.
                        password_change_required:
                          type: boolean
                          example: false
                          description: 'True while the camera still has the factory-default Administrator password and enforces the first change:
                            every request except GET /nuraeye/capabilities then answers 428 until the Administrator sets a new password (ONVIF
                            SetUser / WAN SetUserPassword).'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
  /nuraeye/session/logout:
    post:
      operationId: sessionLogout
      summary: Revoke the presented bearer token (idempotent)
      description: Revoking an already-unknown/expired token is not an error.
      responses:
        '200':
          description: Always succeeds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /nuraeye/wifi:
    get:
      operationId: getWifi
      responses:
        '200':
          description: Current WiFi credentials (empty strings if never provisioned / Ethernet-connected)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    output:
                      type: object
                      properties:
                        ssid:
                          type: string
                        psk:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
    post:
      operationId: setWifi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ssid
              - psk
              properties:
                ssid:
                  type: string
                psk:
                  type: string
                verify:
                  type: boolean
                  default: true
                  description: |
                    true = connect & verify before saving; false = save only, no connect attempt. Forced false server-side if the camera is currently reached over Ethernet, regardless of the requested value (NW5 safety override).
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /nuraeye/wifi/signal:
    get:
      operationId: getWifiSignal
      responses:
        '200':
          description: Current WiFi RSSI/SNR
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    output:
                      type: object
                      properties:
                        rssi:
                          type: string
                          description: Integer value sent as a string (a long-standing wire quirk).
                        snr:
                          type: string
                          description: Integer value sent as a string (a long-standing wire quirk).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /nuraeye/timezones:
    get:
      operationId: getTimezones
      summary: Curated, camera-served time-zone catalog
      responses:
        '200':
          description: Static list — same on every device, not persisted config
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    output:
                      type: object
                      properties:
                        timezones:
                          type: array
                          items:
                            type: object
                            properties:
                              code:
                                type: string
                                example: IST-5:30
                              name:
                                type: string
                                example: India Standard Time - Kolkata (UTC+05:30)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
  /nuraeye/cloud/parameters:
    get:
      operationId: getCloudParameters
      responses:
        '200':
          description: AWS IoT broker endpoint + KVS stream name
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    output:
                      type: object
                      properties:
                        iot_broker_endpoint:
                          type: string
                        kvs_stream_name:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          description: Cloud connectivity is not available on this camera.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /nuraeye/cloud/streaming:
    get:
      operationId: getCloudStreamingStatus
      responses:
        '200':
          description: Current KVS cloud-streaming status
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    output:
                      type: object
                      properties:
                        stream_status:
                          type: string
                          enum:
                          - active
                          - degraded
                          - not_available
                          - idle
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
    post:
      operationId: stopCloudStreaming
      summary: Stop cloud (KVS) streaming — stop only, no LAN "start" (starting is WAN/MQTT-only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - active
              properties:
                active:
                  type: boolean
                  enum:
                  - false
                  description: Only false is accepted
      responses:
        '200':
          description: Stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
  /nuraeye/alert-rules/query:
    post:
      operationId: queryAlertRule
      summary: Read one detection rule's alert choices (read counterpart to POST /nuraeye/alert-rules)
      description: POST, not GET, because it needs input (the rule name) and this API puts all input in a JSON body, never a query parameter.
        Split onto its own path rather than sharing /nuraeye/alert-rules with the write side, since both directions are POST here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rule
              properties:
                rule:
                  type: string
                  example: MyPersonDetectorRule
      responses:
        '200':
          description: Current alert choices for the rule
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    output:
                      type: object
                      properties:
                        mobile_notifications:
                          type: boolean
                        buzzer_activation:
                          type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
        '404':
          $ref: '#/components/responses/NotFound'
  /nuraeye/alert-rules:
    post:
      operationId: setAlertRule
      summary: Update one detection rule's alert choices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rule
              - mobile_notifications
              - buzzer_activation
              properties:
                rule:
                  type: string
                mobile_notifications:
                  type: boolean
                buzzer_activation:
                  type: boolean
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /nuraeye/events/preferences:
    get:
      operationId: getEventPreferences
      summary: Per-event-type enable/disable state
      description: Not to be confused with /nuraeye/alert-rules above — that's per-rule action toggles (mobile_notifications/buzzer_activation);
        this is whether an event *type* is generated at all, device-wide. Keys are exactly the strings GET /nuraeye/capabilities's supported_event_types
        reports.
      responses:
        '200':
          description: Current enabled/disabled state per event type
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    output:
                      type: object
                      additionalProperties:
                        type: boolean
                      example:
                        VideoModeChanged: true
                        PrivacyModeChanged: true
                        PersonDetected: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
    post:
      operationId: setEventPreferences
      summary: Partial update — only keys present in the body change
      description: |
        Disabling a type suppresses it at the source (EventMgr_Send()) — before it reaches either the NuraEye MQTT alert topic or ONVIF PullPoint, so a third-party NVR/VMS client stops receiving it too, per direct user decision. A key not in supported_event_types is a 400, not silently ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: boolean
              example:
                VideoModeChanged: false
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /nuraeye/events/response-actions:
    get:
      operationId: getEventResponseActions
      summary: Selected automatic response actions per detection event type
      description: Not to be confused with /nuraeye/events/preferences above (event on/off) or /nuraeye/alert-rules (per-rule action toggles)
        — this controls what happens in addition once an already-enabled detection-type event fires. Keys are exactly the detection-type strings
        GET /nuraeye/capabilities's supported_event_deterrence_options reports; state-change events are never valid keys here.
      responses:
        '200':
          description: Current selected response actions per detection event type
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    output:
                      type: object
                      additionalProperties:
                        type: array
                        items:
                          type: string
                      example:
                        PersonDetected:
                        - mobile_alert
                        - warning
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
    post:
      operationId: setEventResponseActions
      summary: Partial update — each key's array fully replaces that event type's action set
      description: mobile_alert carries no device-side effect (advisory only, read by the receiving app to decide whether to show a push notification)
        — it never gates whether the camera delivers the event, unlike /nuraeye/events/preferences. siren/spotlight/warning are real physical
        actions the camera auto-triggers using a firmware-chosen duration. A key that isn't a detection-eligible event type, or an action not
        eligible for that type (per supported_event_deterrence_options), is a 400 — the whole request is rejected, not partially applied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              example:
                PersonDetected:
                - siren
                - mobile_alert
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /nuraeye/events/loitering-duration:
    get:
      operationId: getLoiteringDuration
      summary: Currently-configured loitering-detection dwell duration
      responses:
        '200':
          description: Current loitering duration
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    output:
                      type: object
                      properties:
                        loitering_duration_seconds:
                          type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
    post:
      operationId: setLoiteringDuration
      summary: Sets the loitering-detection dwell duration
      description: Valid range is GET /nuraeye/capabilities' loitering_duration_min_seconds/max_seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - loitering_duration_seconds
              properties:
                loitering_duration_seconds:
                  type: integer
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /nuraeye/events/bbox-overlay:
    get:
      operationId: getBboxOverlay
      summary: Currently-configured detection bounding-box overlay on/off value
      responses:
        '200':
          description: Current bbox-overlay value
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    output:
                      type: object
                      properties:
                        enabled:
                          type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
    post:
      operationId: setBboxOverlay
      summary: Sets the detection bounding-box overlay on/off
      description: Whether this build is even capable of drawing a box is GET /nuraeye/capabilities' bbox_overlay_capable — this pair only reads/writes
        the current value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enabled
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
