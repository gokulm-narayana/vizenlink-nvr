  /nuraeye/health:
    get:
      operationId: getDeviceHealth
      summary: Reboot/uptime/clock-sync vitals and firmware version
      description: Read-only; every field is derived by the camera. `last_reboot_utc` reads 0 until the first NTP sync of the current boot corrects
        it (the camera has no battery-backed clock); 0 means not yet corrected this boot, not that the camera has never booted. `clock_sync_state`
        is `synced` or `uncertain`. `firmware_version` repeats the ONVIF `GetDeviceInformation` value.
      responses:
        '200':
          description: Current reboot/uptime/clock-sync health state
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    output:
                      type: object
                      properties:
                        reboot_count:
                          type: integer
                        last_reboot_utc:
                          type: integer
                          description: UTC epoch seconds; 0 = not yet corrected this boot
                        reboot_reason:
                          type: string
                          description: Why the current boot happened -- e.g. "Firmware Upgrade", "Factory Reset", "HTTP Server Failure", "Manual
                            Reboot", "WiFi Provisioning", "Sensor Capture Mode Change", or "Unknown / Crash" for a genuine uncontrolled crash.
                            Free text, not a closed enum -- new reasons may be added without a schema change.
                        uptime_seconds:
                          type: integer
                        clock_sync_state:
                          type: string
                          enum:
                          - synced
                          - uncertain
                        uncertain_since:
                          type: integer
                          description: UTC epoch seconds clock became uncertain; 0 if synced
                        firmware_version:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
