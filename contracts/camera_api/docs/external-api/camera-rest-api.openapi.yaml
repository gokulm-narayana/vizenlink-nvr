      summary: Each deterrence action's own independent active/inactive state
      description: siren/spotlight/warning are independent hardware outputs and can be active simultaneously ( — the previous single {active,
        action} shape could only ever report one action as "the" active one, so a client that triggered a second action while the first was still
        on had no way to represent both as active).
      responses:
        '200':
