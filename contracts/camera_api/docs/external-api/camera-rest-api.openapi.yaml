      summary: Currently-configured recorded-clip (segment) duration
      responses:
        '200':
          description: Current clip duration
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    output:
                      type: object
                      properties:
                        clip_duration_seconds:
                          type: integer
