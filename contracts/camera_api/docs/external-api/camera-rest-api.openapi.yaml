  /nuraeye/preview-key:
    get:
      operationId: getPreviewKey
      summary: Fetch the camera-generated shared key for end-to-end-encrypted WAN preview snapshots
      description: 'LAN-only: a client calls it at onboarding or first WAN setup. The camera generates one shared AES-256 key on first call and
        persists it, so any number of clients can fetch the same key. The matching capture/encrypt/publish path is WAN-MQTT-only (GetPreviewSnapshot)
        and outside this REST API.'
      responses:
        '200':
          description: The shared key (generated on first call if none existed yet)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    output:
                      type: object
                      properties:
                        key:
                          type: string
                          description: base64-encoded AES-256 key (32 bytes)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /nuraeye/live-stream-uri:
    post:
      operationId: getLiveStreamUri
      summary: Resolve the live-view connection URI for a stream profile (transport chosen by the camera)
      description: Resolves where to connect for live video. The response names the transport in `output.transport`; on current firmware it is
        always `rtsp` (RTSPS). POST, not GET, because it takes input (`profile_token`) and this API puts all input in a JSON body. `profile_token`
        Profile_3 has no ONVIF profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - profile_token
              properties:
                profile_token:
                  type: string
                  enum:
                  - Profile_1
                  - Profile_2
                  - Profile_3
      responses:
        '200':
          description: Live-view connection info; transport indicates which player to use
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    output:
                      type: object
                      properties:
                        transport:
                          type: string
                          enum:
                          - rtsp
                          - rtsp
                        port:
                          type: integer
                          example: 556
                        path:
                          type: string
                          example: /mobile
                        url:
                          type: string
                          format: uri
                          example: rtsps://192.0.2.50:556/mobile
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
  /nuraeye/talk-uri:
    post:
      operationId: getTalkUri
      summary: Resolve the two-way-talk connection URI (dedicated audio-only RTSPS module)
      description: 'Two-way-talk discovery — the talk counterpart of POST /nuraeye/live-stream-uri. Resolves the connection info for, the dedicated
        audio-only talk RTSPS server (port 560, RECORD-based, two AAC-LC/8000 Hz tracks: streamid=0 camera mic to client, streamid=1 client mic
        to camera), completely independent of live view and limited to one talker at a time. There is one talk resource (audio-only, always-on),
        so unlike live-stream-uri there is no profile_token and no transport choice: the module is TLS-only, so output.transport is always "rtsps".
        The request body is ignored (send an empty object). Local-IP resolution failure, or a build without AUDIO_ENABLED, returns 400. A second
        concurrent talk session is rejected by the module at RECORD time, not by this endpoint. No WAN counterpart ( is Planned); a future WAN
        leg would be an additive transport value here.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Two-way-talk connection info
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    output:
                      type: object
                      properties:
                        transport:
                          type: string
                          enum:
                          - rtsps
                        port:
                          type: integer
                          example: 560
                        path:
                          type: string
                          example: /talk
                        url:
                          type: string
                          format: uri
                          example: rtsps://192.0.2.50:560/talk
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
  /nuraeye/deterrence:
