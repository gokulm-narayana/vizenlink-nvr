        '428':
          $ref: '#/components/responses/PasswordChangeRequired'
    post:
      operationId: setRecordingClipDuration
      summary: Sets the recorded-clip duration for future segment rotations
      description: Applies only to the next segment rotation -- the segment currently being written keeps its original length. Valid range is
        GET /nuraeye/capabilities' recording_clip_duration_min_seconds/max_seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
