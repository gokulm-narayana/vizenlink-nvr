[project]
name = "vizenlink-nvr"
version = "0.1.0"
description = "VizenLink Network Video Recorder"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
    "cryptography~=50.0",
    "keyring~=25.7",
    "ifaddr~=0.2",
    "defusedxml~=0.7",
    "sqlalchemy[asyncio]~=2.1",
    "aiosqlite~=0.22",
    "alembic~=1.20",
    "typer~=0.27",
    "rich~=15.0",
    "pydantic~=2.14",
    "pydantic-settings~=2.16",
    "platformdirs~=4.13",
    "pyyaml~=6.0",
    "tzdata",
    "tzlocal~=5.4",
    "argon2-cffi~=23.1",
    "fastapi~=0.115",
    "uvicorn[standard]~=0.34",
    "zeroconf>=0.153.0",
    "psutil~=7.2",
]

[dependency-groups]
dev = [
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "pytest-timeout~=2.4",
    "ruff~=0.17",
    "mypy~=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vizenlink_nvr"]

[project.scripts]
nvr = "vizenlink_nvr.cli.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["sim"]
timeout = 30
addopts = "-m 'not hardware and not mediamtx' --strict-markers"
markers = [
    "hardware",
    "hardware_destructive",
    "mediamtx",
    "behavior(id): contract rule id from contracts/behaviors.yaml",
]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ", "S", "ASYNC"]
ignore = ["ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"sim/**" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = [
    "vizenlink_nvr.camera.*",
    "vizenlink_nvr.services.*",
    "vizenlink_nvr.secrets.*",
]
strict = true

[[tool.mypy.overrides]]
module = [
    "yaml",
    "defusedxml.*",
    "ifaddr",
    "keyring.*",
    "tzlocal",
]
ignore_missing_imports = true
